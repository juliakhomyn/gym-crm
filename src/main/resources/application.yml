spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  liquibase:
    changelog: classpath:db/migration/master.xml
  datasource:
    driver: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gym_db
    username: gymuser
    password: gympass

storage:
  data:
    trainee: src/main/resources/data/trainees.csv
    trainer: src/main/resources/data/trainers.csv
    training: src/main/resources/data/trainings.csv

app:
  api:
    base-path: /api/v1